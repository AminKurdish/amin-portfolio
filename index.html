<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Dev Amin</title>
    <link rel="icon" href="/image/2.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Noto Sans Arabic', 'sans-serif'],
            },
            colors: {
              primary: {
                50: 'var(--color-primary-50)',
                100: 'var(--color-primary-100)',
                200: 'var(--color-primary-200)',
                300: 'var(--color-primary-300)',
                400: 'var(--color-primary-400)',
                500: 'var(--color-primary-500)',
                600: 'var(--color-primary-600)',
                700: 'var(--color-primary-700)',
                800: 'var(--color-primary-800)',
                900: 'var(--color-primary-900)',
              }
            }
          },
        },
      }
    </script>
    <!-- Google Fonts: Inter for Latin, Noto Sans Arabic for Arabic/Kurdish -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', 'Noto Sans Arabic', sans-serif;
      }
      /* Smooth scrolling for anchor links */
      html {
        scroll-behavior: smooth;
      }

      /* Custom Scrollbar Styling */
      /* Webkit (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 12px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: var(--color-primary-300); /* Color matching the theme */
        border-radius: 20px;
        border: 3px solid transparent; /* Creates padding effect */
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: var(--color-primary-500); /* Darker shade on hover */
      }

      /* Dark mode adjustments */
      html.dark ::-webkit-scrollbar-thumb {
        background-color: var(--color-primary-600);
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background-color: var(--color-primary-400);
      }

      /* Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: var(--color-primary-300) transparent;
      }
      html.dark {
        scrollbar-color: var(--color-primary-600) transparent;
      }

      :root {
        /* Default Blue Values - will be overwritten by React */
        --color-primary-50: #eff6ff;
        --color-primary-100: #dbeafe;
        --color-primary-200: #bfdbfe;
        --color-primary-300: #93c5fd;
        --color-primary-400: #60a5fa;
        --color-primary-500: #3b82f6;
        --color-primary-600: #2563eb;
        --color-primary-700: #1d4ed8;
        --color-primary-800: #1e40af;
        --color-primary-900: #1e3a8a;
      }

      /* Loader CSS */
      /* From Uiverse.io by andrew-manzyk */ 
      .loader {
        --main-size: 4em;
        --text-color: #ffffff;
        --shine-color: #ffffff40;
        --shadow-color: #aaaaaa;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        user-select: none;
        position: relative;
        font-size: var(--main-size);
        font-weight: 900;
        text-transform: uppercase;
        color: var(--text-color);
        width: 7.3em;
        height: 1em;
        filter: drop-shadow(0 0 0.05em var(--shine-color));
      }

      .loader .text {
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        position: absolute;
      }

      .loader .text:nth-child(1) {
        clip-path: polygon(0% 0%, 11.11% 0%, 11.11% 100%, 0% 100%);
        font-size: calc(var(--main-size) / 20);
        margin-left: -2.1em;
        opacity: 0.6;
      }

      .loader .text:nth-child(2) {
        clip-path: polygon(11.11% 0%, 22.22% 0%, 22.22% 100%, 11.11% 100%);
        font-size: calc(var(--main-size) / 16);
        margin-left: -0.98em;
        opacity: 0.7;
      }

      .loader .text:nth-child(3) {
        clip-path: polygon(22.22% 0%, 33.33% 0%, 33.33% 100%, 22.22% 100%);
        font-size: calc(var(--main-size) / 13);
        margin-left: -0.33em;
        opacity: 0.8;
      }

      .loader .text:nth-child(4) {
        clip-path: polygon(33.33% 0%, 44.44% 0%, 44.44% 100%, 33.33% 100%);
        font-size: calc(var(--main-size) / 11);
        margin-left: -0.05em;
        opacity: 0.9;
      }

      .loader .text:nth-child(5) {
        clip-path: polygon(44.44% 0%, 55.55% 0%, 55.55% 100%, 44.44% 100%);
        font-size: calc(var(--main-size) / 10);
        margin-left: 0em;
        opacity: 1;
      }

      .loader .text:nth-child(6) {
        clip-path: polygon(55.55% 0%, 66.66% 0%, 66.66% 100%, 55.55% 100%);
        font-size: calc(var(--main-size) / 11);
        margin-left: 0.05em;
        opacity: 0.9;
      }

      .loader .text:nth-child(7) {
        clip-path: polygon(66.66% 0%, 77.77% 0%, 77.77% 100%, 66.66% 100%);
        font-size: calc(var(--main-size) / 13);
        margin-left: 0.33em;
        opacity: 0.8;
      }

      .loader .text:nth-child(8) {
        clip-path: polygon(77.77% 0%, 88.88% 0%, 88.88% 100%, 77.77% 100%);
        font-size: calc(var(--main-size) / 16);
        margin-left: 0.98em;
        opacity: 0.7;
      }

      .loader .text:nth-child(9) {
        clip-path: polygon(88.88% 0%, 100% 0%, 100% 100%, 88.88% 100%);
        font-size: calc(var(--main-size) / 20);
        margin-left: 2.1em;
        opacity: 0.6;
      }

      .loader .text span {
        animation:
          scrolling 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite,
          shadow 2s cubic-bezier(0.1, 0.6, 0.9, 0.4) infinite;
      }

      .loader .text:nth-child(1) span {
        background: linear-gradient(
          to right,
          var(--text-color) 4%,
          var(--shadow-color) 7%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(2) span {
        background: linear-gradient(
          to right,
          var(--text-color) 9%,
          var(--shadow-color) 13%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(3) span {
        background: linear-gradient(
          to right,
          var(--text-color) 15%,
          var(--shadow-color) 18%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(4) span {
        background: linear-gradient(
          to right,
          var(--text-color) 20%,
          var(--shadow-color) 23%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(6) span {
        background: linear-gradient(
          to right,
          var(--shadow-color) 29%,
          var(--text-color) 32%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(7) span {
        background: linear-gradient(
          to right,
          var(--shadow-color) 34%,
          var(--text-color) 37%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(8) span {
        background: linear-gradient(
          to right,
          var(--shadow-color) 39%,
          var(--text-color) 42%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .text:nth-child(9) span {
        background: linear-gradient(
          to right,
          var(--shadow-color) 45%,
          var(--text-color) 48%
        );
        background-size: 200% auto;
        background-clip: text;
        color: transparent;
      }

      .loader .line {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        height: 0.05em;
        width: calc(var(--main-size) / 2);
        margin-top: 0.9em;
        border-radius: 0.05em;
      }

      .loader .line::before {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: var(--text-color);
        opacity: 0.3;
      }

      .loader .line::after {
        content: "";
        position: absolute;
        height: 100%;
        width: 100%;
        background-color: var(--text-color);
        border-radius: 0.05em;
        transform: translateX(-90%);
        animation: wobble 2s cubic-bezier(0.5, 0.8, 0.5, 0.2) infinite;
      }

      @keyframes wobble {
        0% {
          transform: translateX(-90%);
        }
        50% {
          transform: translateX(90%);
        }
        100% {
          transform: translateX(-90%);
        }
      }

      @keyframes scrolling {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }

      @keyframes shadow {
        0% {
          background-position: -98% 0;
        }
        100% {
          background-position: 102% 0;
        }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.33.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gray-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 transition-colors duration-300 overflow-x-hidden">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
